<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kareoke</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene" id="scene_screen">
        <div class="column column_1">
            <div class="qrCodeHolder">
                <img class="qrCodeImg" alt="">
            </div>
            <div class="subtitle">Scan To Add Songs</div>
            <div class="queueList queueElem"></div>
        </div>
        <div class="displayingPort">
            <div class="appearingText">Scan QR To Add Songs</div>
            <video class="displayingVideo"></video>
            <div class="durrationBar"></div>
        </div>
    </div>
    
    
    <div class="scene" id="scene_usersigned">
        <div class="signed_header">
            <div class="sideRow">
                <div class="logo"><div class="logoText logoBrownText">PAWS</div><div class="logoText logoRedText">KARAOKE</div></div>
                <div class="adminControlsHolder"><img src="img/moveIcon.png" class="adminControlsIcon" alt=""></div>
            </div>
            <div class="inputSearchContainer">
                <img src="img/search.png" class="findSongButton" alt="">
                <input type="text" class="songTitle" placeholder="Search songs or artists...">
                <img class="clearSearch" src="img/deleteIcon.png" alt="">
            </div>
            <div class="addSongTopRow">
                <div class="singMode active"><div class="singAlone">Sing Alone</div></div>
                <div class="singMode"><div class="singAlong">Sing Along</div></div>
            </div>
        </div>
        <div class="userStatSongs">
            <div class="userStatDiv" id="userStat_mostPlayed">Most Played</div>
            <div class="userStatDiv" id="userStat_Favorites">Favorites</div>
            <div class="userStatDiv" id="userStat_History">History</div>
        </div>
        <div class="songResultsDiv"></div>
        <div id="queueSheet">
            <div id="dragHandle">
                <div id="currentSong">

                </div>
                <img id="collapseBtn" src="img/arrowIcon.png">
            </div>

            <div id="queueContent">
                <div class="queueList queueElem"></div>
            </div>
        </div>
    </div>

    <div class="displayDiv">
        <div class="header">
            <div class="displayTitle"></div>
            <img class="displayExit" src="img/deleteIcon.png" alt="">
        </div>
        <div class="displayBody"></div>

    </div>

    <div class="promptQR">
        <div class="blurredBackground"></div>
        <div class="popupBody">
            <div class="popup_title2">Your Songs Next!</div>
            <button class="popup_button promptOK">Start Song</button>

        </div>
    </div>
    <div class="popup">
        <div class="blurredBackground"></div>
        <div class="popupBody">
            <div class="popup_title"></div>
            <input type="text" class="showNameInput" placeholder="Show Name...">
            <div class="popup_bottomRow">
                <button class="popup_button popup_cancel">Cancel</button>
                <button class="popup_button popup_affirm">Add To Queue!</button>
            </div>
        </div>
    </div>
    <div class="queuePopup">
        <div class="qpSetting" id="qpExit">Exit</div>
        <div class="qpSetting qpAdmin" id="qpMoveTop">Move Top</div>
        <div class="qpSetting qpAdmin" id="qpMoveUp">Move Up</div>
        <div class="qpSetting" id="qpMoveDown">Move Down</div>
        <div class="qpSetting" id="qpMoveBottom">Move Bottom</div>
        <div class="qpSetting" id="qpChangeSong">Change Song</div>
        <div class="qpSetting" id="qpEmpty"></div>
        <div class="qpSetting qpRed" id="qpRemove">Remove</div>
    </div>


    <script src="io.js"></script>
    <script src="library_simple_v16.js"></script>
    <script src="server.js"></script>
    <script src="main.js"></script>
</body>
</html>
